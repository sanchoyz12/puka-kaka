<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ПУКА КАКА - Мега Мем Игра</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8B4513;
            --secondary: #D2691E;
            --accent: #FFD700;
            --bg-top: #ffefba;
            --bg-bottom: #ffffff;
            --puka-color: rgba(160, 150, 0, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, var(--bg-top), var(--bg-bottom));
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            max-width: 100%;
            max-height: 100%;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            text-align: center;
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 0.5rem;
            color: var(--accent);
            text-shadow: 4px 4px 0px var(--primary);
            font-weight: 900;
        }

        p.subtitle {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            font-weight: 700;
            max-width: 80%;
        }

        .btn-start {
            padding: 1rem 2.5rem;
            font-size: 1.8rem;
            background: var(--accent);
            color: var(--primary);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 900;
            box-shadow: 0 6px 0 var(--primary);
            transition: transform 0.1s;
        }

        .btn-start:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 var(--primary);
        }

        #score-display {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 3.5rem;
            font-weight: 900;
            color: var(--primary);
            z-index: 5;
            text-shadow: 2px 2px 0px rgba(255, 255, 255, 0.8);
            pointer-events: none;
        }

        #high-score {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 1rem;
            font-weight: 700;
            color: var(--primary);
            z-index: 5;
            background: rgba(255, 255, 255, 0.5);
            padding: 5px 12px;
            border-radius: 10px;
        }

        #puka-counter {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 1rem;
            color: var(--primary);
            font-weight: 700;
            background: rgba(255, 255, 255, 0.5);
            padding: 5px 12px;
            border-radius: 10px;
            z-index: 5;
        }
    </style>
</head>

<body>

    <div id="game-container">
        <div id="score-display">0</div>
        <div id="high-score">РЕКОРД: 0</div>
        <div id="puka-counter">ПУКОВ: 0</div>

        <canvas id="game-canvas"></canvas>

        <div id="start-screen" class="overlay">
            <h1>ПУКА КАКА</h1>
            <p class="subtitle">Лети и пукай! Каждое нажатие — это реактивный залп 💩</p>
            <button class="btn-start" onclick="initGame()">ИГРАТЬ!</button>
            <p style="margin-top: 20px; font-size: 0.8rem; opacity: 0.8;">Кликай или жми ПРОБЕЛ</p>
        </div>

        <div id="ready-screen" class="overlay hidden">
            <h1 style="font-size: 2rem;">ПРИГОТОВИТЬСЯ...</h1>
            <p class="subtitle">Нажми, чтобы пукнуть и взлететь!</p>
        </div>

        <div id="game-over-screen" class="overlay hidden">
            <h1 style="color: #ff4444; font-size: 3rem;">ВСЁ, ПРИПЛЫЛИ!</h1>
            <p class="subtitle" id="final-score-text">Твой счет: 0</p>
            <button class="btn-start" onclick="initGame()">ПОВТОРИТЬ!</button>
            <p id="death-quote" style="margin-top: 20px; font-style: italic; font-size: 0.9rem;">"Слишком много
                бумаги..."</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score-display');
        const highScoreEl = document.getElementById('high-score');
        const pukaCounterEl = document.getElementById('puka-counter');
        const startScreen = document.getElementById('start-screen');
        const readyScreen = document.getElementById('ready-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreText = document.getElementById('final-score-text');
        const deathQuoteEl = document.getElementById('death-quote');

        const heroImg = new Image(); heroImg.src = 'hero.png';
        const tpImg = new Image(); tpImg.src = 'tp.png';

        let gameState = 'START'; // START, READY, PLAYING, GAMEOVER
        let score = 0;
        let highScore = localStorage.getItem('puka_high_score') || 0;
        let pukaCount = 0;
        let lastTime = 0;

        // Physics constants (normalized for 60fps)
        const GRAVITY = 0.5;
        const JUMP_FORCE = -8.5;
        const PIPE_SPEED = 3.5;
        const PIPE_SPAWN_RATE = 1500; // ms
        const GAP_SIZE = 240;

        let hero = { x: 80, y: 0, w: 60, h: 60, velocity: 0, rotation: 0 };
        let obstacles = [];
        let pukaClouds = [];
        let lastPipeTime = 0;

        const deathQuotes = [
            "Слишком много бумаги...",
            "Твой пук был слишком слаб.",
            "Бумажная атака!",
            "Ты был хорошей какахой.",
            "Вернись в лоток!",
            "Запор системных ресурсов."
        ];

        highScoreEl.innerText = `РЕКОРД: ${highScore}`;

        let audioCtx = null;
        async function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }
        }

        function playPukaSound() {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } catch (e) { }
        }

        function resizeCanvas() {
            const container = document.getElementById('game-container');
            const dpr = window.devicePixelRatio || 1;
            canvas.width = container.clientWidth * dpr;
            canvas.height = container.clientHeight * dpr;
            ctx.scale(dpr, dpr);

            // Adjust hero size and gap based on screen height to keep it playable
            const scale = Math.min(container.clientWidth / 500, container.clientHeight / 700);
            hero.w = 60 * Math.max(0.8, scale);
            hero.h = 60 * Math.max(0.8, scale);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        async function initGame() {
            await initAudio();
            gameState = 'READY';
            score = 0;
            pukaCount = 0;
            scoreEl.innerText = '0';
            pukaCounterEl.innerText = 'ПУКОВ: 0';

            const dpr = window.devicePixelRatio || 1;
            const viewHeight = canvas.height / dpr;
            hero.y = viewHeight / 2 - 30;
            hero.velocity = 0;
            hero.rotation = 0;
            obstacles = [];
            pukaClouds = [];
            lastPipeTime = 0;

            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            readyScreen.classList.remove('hidden');

            if (lastTime === 0) {
                lastTime = performance.now();
                requestAnimationFrame(gameLoop);
            }
        }

        async function jump(e) {
            if (e && e.type === 'touchstart') e.preventDefault();

            // Critical for mobile: resume audio onทุก attempt
            if (audioCtx && audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }

            if (gameState === 'READY') {
                gameState = 'PLAYING';
                readyScreen.classList.add('hidden');
            }
            if (gameState !== 'PLAYING') return;

            hero.velocity = JUMP_FORCE;
            pukaCount++;
            pukaCounterEl.innerText = `ПУКОВ: ${pukaCount}`;
            playPukaSound();

            for (let i = 0; i < 6; i++) {
                pukaClouds.push({
                    x: hero.x + 20,
                    y: hero.y + hero.h / 2,
                    radius: Math.random() * 15 + 10,
                    vx: -Math.random() * 4 - 2,
                    vy: Math.random() * 4 - 2,
                    alpha: 0.8,
                    color: `rgba(${139 + Math.random() * 50}, ${69 + Math.random() * 40}, 19, 0.5)`
                });
            }
        }

        window.addEventListener('keydown', (e) => { if (e.code === 'Space') jump(e); });
        // Use both to ensure it works on every device
        canvas.addEventListener('mousedown', (e) => { jump(e); });
        canvas.addEventListener('touchstart', (e) => { jump(e); }, { passive: false });
        // Also the whole container for safety
        readyScreen.addEventListener('touchstart', (e) => { jump(e); }, { passive: false });
        readyScreen.addEventListener('mousedown', (e) => { jump(e); });

        function spawnObstacle() {
            const dpr = window.devicePixelRatio || 1;
            const viewWidth = canvas.width / dpr;
            const viewHeight = canvas.height / dpr;

            const minHeight = 100;
            const currentGap = Math.max(180, GAP_SIZE * (viewHeight / 800));
            const maxHeight = viewHeight - currentGap - minHeight;
            const topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;

            obstacles.push({
                x: viewWidth,
                y: 0,
                w: 70,
                h: topHeight,
                passed: false,
                type: 'top',
                gap: currentGap
            });

            obstacles.push({
                x: viewWidth,
                y: topHeight + currentGap,
                w: 70,
                h: viewHeight - (topHeight + currentGap),
                passed: false,
                type: 'bottom'
            });
        }

        function gameLoop(timestamp) {
            const dt = timestamp - lastTime;
            lastTime = timestamp;
            if (dt > 100) return requestAnimationFrame(gameLoop);
            const factor = dt / 16.66; // Normalize to 60fps

            const dpr = window.devicePixelRatio || 1;
            const viewWidth = canvas.width / dpr;
            const viewHeight = canvas.height / dpr;

            ctx.clearRect(0, 0, viewWidth, viewHeight);

            // Background grid
            ctx.strokeStyle = 'rgba(0,0,0,0.03)';
            ctx.lineWidth = 1;
            for (let i = 0; i < viewWidth; i += 40) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, viewHeight); ctx.stroke(); }
            for (let j = 0; j < viewHeight; j += 40) { ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(viewWidth, j); ctx.stroke(); }

            if (gameState === 'PLAYING') {
                hero.velocity += GRAVITY * factor;
                hero.y += hero.velocity * factor;
                hero.rotation = Math.min(Math.PI / 6, Math.max(-Math.PI / 8, hero.velocity * 0.05));

                if (timestamp - lastPipeTime > PIPE_SPAWN_RATE) {
                    spawnObstacle();
                    lastPipeTime = timestamp;
                }

                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let obs = obstacles[i];
                    obs.x -= PIPE_SPEED * factor;

                    ctx.save();
                    ctx.translate(obs.x + obs.w / 2, obs.y + obs.h / 2);
                    if (obs.type === 'top') ctx.rotate(Math.PI);
                    ctx.drawImage(tpImg, -obs.w / 2, -obs.h / 2, obs.w, obs.h);
                    ctx.restore();

                    const margin = 12;
                    if (hero.x + margin < obs.x + obs.w &&
                        hero.x + hero.w - margin > obs.x &&
                        hero.y + margin < obs.y + obs.h &&
                        hero.y + hero.h - margin > obs.y) {
                        gameOver();
                    }

                    if (obs.type === 'top' && !obs.passed && hero.x > obs.x + obs.w) {
                        score++;
                        obs.passed = true;
                        scoreEl.innerText = score;
                    }
                    if (obs.x + obs.w < -100) obstacles.splice(i, 1);
                }

                if (hero.y + hero.h - 10 > viewHeight || hero.y < -80) {
                    gameOver();
                }
            } else if (gameState === 'READY') {
                // Bobbing animation for hero
                const dpr = window.devicePixelRatio || 1;
                const viewHeight = canvas.height / dpr;
                hero.y = (viewHeight / 2 - 30) + Math.sin(timestamp / 200) * 10;
            }

            // Puka Clouds
            for (let i = pukaClouds.length - 1; i >= 0; i--) {
                let p = pukaClouds[i];
                p.x += p.vx * factor;
                p.y += p.vy * factor;
                p.alpha -= 0.02 * factor;
                p.radius += 0.4 * factor;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color.replace('0.5', Math.max(0, p.alpha));
                ctx.fill();
                if (p.alpha <= 0) pukaClouds.splice(i, 1);
            }

            // Draw Hero
            ctx.save();
            ctx.translate(hero.x + hero.w / 2, hero.y + hero.h / 2);
            ctx.rotate(hero.rotation);
            ctx.drawImage(heroImg, -hero.w / 2, -hero.h / 2, hero.w, hero.h);
            ctx.restore();

            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            if (gameState === 'GAMEOVER') return;
            gameState = 'GAMEOVER';
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('puka_high_score', highScore);
                highScoreEl.innerText = `РЕКОРД: ${highScore}`;
            }
            finalScoreText.innerText = `Твой счет: ${score}`;
            deathQuoteEl.innerText = deathQuotes[Math.floor(Math.random() * deathQuotes.length)];
            gameOverScreen.classList.remove('hidden');
        }
    </script>
</body>

</html>
